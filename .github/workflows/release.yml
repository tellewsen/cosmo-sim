name: Release binaries

on:
  push:
    tags: ["v*"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build cosmo_sim-hydro (Linux)
        run: |
          cargo build --profile dist --features hydro
          cp target/dist/cosmo_sim cosmo_sim-hydro-linux-x86_64

      - name: Build cosmo_sim-hydro-sym (Linux)
        run: |
          cargo build --profile dist --features hydro,symmetron
          cp target/dist/cosmo_sim cosmo_sim-hydro-sym-linux-x86_64

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cosmo_sim-hydro-linux-x86_64
            cosmo_sim-hydro-sym-linux-x86_64

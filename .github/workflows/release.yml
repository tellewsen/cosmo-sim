name: Release binaries

on:
  push:
    tags: ["v*"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build cosmo_sim-hydro (Linux)
        run: |
          cargo build --profile dist --features hydro
          cp target/dist/cosmo_sim cosmo_sim-hydro-linux-x86_64

      - name: Build cosmo_sim-hydro-sym (Linux)
        run: |
          cargo build --profile dist --features hydro,symmetron
          cp target/dist/cosmo_sim cosmo_sim-hydro-sym-linux-x86_64

      - name: Upload Linux binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cosmo_sim-hydro-linux-x86_64
            cosmo_sim-hydro-sym-linux-x86_64

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW cross-compiler
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build cosmo_sim-hydro (Windows)
        run: |
          cargo build --profile dist --features hydro --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/dist/cosmo_sim.exe cosmo_sim-hydro-windows-x86_64.exe

      - name: Build cosmo_sim-hydro-sym (Windows)
        run: |
          cargo build --profile dist --features hydro,symmetron --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/dist/cosmo_sim.exe cosmo_sim-hydro-sym-windows-x86_64.exe

      - name: Upload Windows binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cosmo_sim-hydro-windows-x86_64.exe
            cosmo_sim-hydro-sym-windows-x86_64.exe

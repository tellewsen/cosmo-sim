name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: fmt check
        run: cargo fmt --check

      - name: clippy (base)
        run: cargo clippy -- -D warnings

      - name: test (base)
        run: cargo test

      - name: test --features fofr
        run: cargo test --features fofr

      - name: test --features hydro
        run: cargo test --features hydro

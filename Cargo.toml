[package]
name = "cosmo_sim"
version = "0.2.0"
edition = "2021"
authors = ["Based on ISIS/RAMSES by Llinares, Mota & Winther (2014), UiO"]
description = "Cosmological N-body simulation with modified gravity scalar field support"

[lib]
name = "cosmo_sim"
path = "src/lib.rs"

[[bin]]
name = "cosmo_sim"
path = "src/main.rs"

[dependencies]
rayon        = "1.10"
ndarray      = { version = "0.16", features = ["rayon"] }
num-traits   = "0.2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
log          = "0.4"
env_logger   = "0.11"
thiserror    = "2"
clap         = { version = "4", features = ["derive"] }
rustfft      = { version = "6", optional = true }
hdf5         = { version = "0.8", optional = true }
mpi          = { version = "0.8", optional = true }

[dev-dependencies]
approx     = "0.5"
criterion  = { version = "0.5", features = ["html_reports"] }

[features]
default     = ["fft_pm"]
symmetron   = []
fofr        = []
hdf5_output = ["hdf5"]
fft_pm      = ["rustfft"]
mpi_parallel = ["mpi"]
hydro       = []

[[bench]]
name = "bench_gravity"
harness = false

[[bench]]
name = "bench_cic"
harness = false

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"

# Leaner build profile for day-to-day development builds alongside running sims.
# Thin LTO peaks at ~2–3 GB vs 8–12 GB for fat LTO — safe in WSL2 (15 GB ceiling).
# Nearly identical runtime performance. Use: make hydro  (Makefile uses this profile)
[profile.dist]
inherits      = "release"
lto           = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2

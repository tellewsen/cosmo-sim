[package]
name = "cosmo_sim"
version = "0.1.0"
edition = "2021"
authors = ["Based on ISIS/RAMSES by Llinares, Mota & Winther (2014), UiO"]
description = """
Cosmological N-body simulation with modified gravity / scalar field support.
Architecture based on ISIS (Llinares, Mota & Winther 2014), itself a modified
gravity extension of RAMSES (Teyssier 2002). Implements AMR, particle-mesh
gravity, and a nonlinear multigrid solver for scalar-tensor theories including
the Symmetron screening mechanism.
"""

[lib]
name = "cosmo_sim"
path = "src/lib.rs"

[[bin]]
name = "cosmo_sim"
path = "src/main.rs"

[dependencies]
rayon        = "1.10"   # Data-parallel iterators (replaces OpenMP)
ndarray      = { version = "0.16", features = ["rayon"] }
num-traits   = "0.2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
log          = "0.4"
env_logger   = "0.11"
thiserror    = "2"
clap         = { version = "4", features = ["derive"] }
hdf5         = { version = "0.8", optional = true }   # output (optional)
fftw         = { version = "0.8", optional = true }   # FFT for IC / PM

[features]
default     = []
symmetron   = []   # Compile-in Symmetron scalar field
fofr        = []   # Compile-in f(R) gravity
hdf5_output = ["hdf5"]
fft_pm      = ["fftw"]

[profile.release]
opt-level   = 3
lto         = "fat"
codegen-units = 1
panic       = "abort"

[profile.dev]
opt-level   = 1

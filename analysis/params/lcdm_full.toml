# ΛCDM reference — full ISIS paper resolution
# Llinares, Mota & Winther (2014) A&A 562 A78, §5.3 ECOSMOG comparison
# 256³ particles, 128 Mpc/h box

[run]
box_size       = 128.0    # Mpc/h — matches ISIS ECOSMOG comparison
n_grid         = 256      # 256³ PM grid
levelmax       = 0
refine_thr     = 8
a_init         = 0.02
a_final        = 1.0
dtau_max       = 2e-5    # ~690 steps (higher resolution for full run)
courant_factor = 0.8

[cosmology]
omega_m      = 0.267
omega_lambda = 0.733
omega_b      = 0.0449
h            = 0.719
n_s          = 0.963
sigma8       = 0.801

[gravity]
epsilon   = 1e-4
n_mg_iter = 50
n_smooth  = 2

[particles]
n_part = 256     # 256³ = 16 777 216 particles
m_part = 0.0

[output]
outdir   = "output_lcdm_full"
n_output = 5
a_out    = [0.33, 0.5, 0.67, 0.82, 1.0]
hdf5     = false

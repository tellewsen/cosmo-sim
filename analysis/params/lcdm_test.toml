# ΛCDM reference run — small box for quick tests / development
# Matches Llinares et al. (2014) A&A 562 A78 cosmology (WMAP7-era)
# 64³ particles, 64 Mpc/h box  (same as ISIS "Symm B" setup at reduced size)

[run]
box_size       = 64.0     # Mpc/h
n_grid         = 64       # domain grid cells per side
levelmax       = 0        # no AMR (keep simple for comparison)
refine_thr     = 8
a_init         = 0.02     # z ≈ 49
a_final        = 1.0      # z = 0
dtau_max       = 5e-5    # ~280 steps from a=0.02 to a=1
courant_factor = 0.8

[cosmology]               # WMAP7 / ISIS paper cosmology
omega_m      = 0.267
omega_lambda = 0.733
omega_b      = 0.0449
h            = 0.719
n_s          = 0.963
sigma8       = 0.801

[gravity]
epsilon   = 1e-4
n_mg_iter = 50
n_smooth  = 2

[particles]
n_part = 64        # 64³ = 262 144 particles
m_part = 0.0       # auto-computed from cosmology

[output]
outdir   = "output_lcdm_test"
n_output = 5
a_out    = [0.33, 0.5, 0.67, 0.82, 1.0]  # z ≈ 2, 1, 0.5, 0.22, 0
hdf5     = false

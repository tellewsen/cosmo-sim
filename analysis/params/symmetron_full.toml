# Symmetron "Symm A" — full ISIS paper resolution
# Llinares, Mota & Winther (2014) A&A 562 A78, §5.3
# 256³ particles, 128 Mpc/h box
# Compile with:  cargo build --release --features symmetron

[run]
box_size       = 128.0
n_grid         = 256
levelmax       = 0
refine_thr     = 8
a_init         = 0.02
a_final        = 1.0
dtau_max       = 2e-5
courant_factor = 0.8

[cosmology]
omega_m      = 0.267
omega_lambda = 0.733
omega_b      = 0.0449
h            = 0.719
n_s          = 0.963
sigma8       = 0.801

[gravity]
epsilon   = 1e-4
n_mg_iter = 50
n_smooth  = 2

[particles]
n_part = 256
m_part = 0.0

[scalar_field]
a_ssb      = 0.5
lambda_0   = 1.0
beta_0     = 1.0
epsilon_mg = 1e-5
non_static = false

[output]
outdir   = "output_symmetron_full"
n_output = 5
a_out    = [0.33, 0.5, 0.67, 0.82, 1.0]
hdf5     = false

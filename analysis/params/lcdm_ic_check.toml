# IC amplitude check — output immediately at a_init to verify P(k) normalization
[run]
box_size       = 64.0
n_grid         = 64
levelmax       = 0
refine_thr     = 8
a_init         = 0.02
a_final        = 0.025
dtau_max       = 5e-5
courant_factor = 0.8

[cosmology]
omega_m      = 0.267
omega_lambda = 0.733
omega_b      = 0.0449
h            = 0.719
n_s          = 0.963
sigma8       = 0.801

[gravity]
epsilon   = 1e-4
n_mg_iter = 50
n_smooth  = 2

[particles]
n_part = 64
m_part = 0.0

[output]
outdir   = "output_ic_check"
n_output = 1
a_out    = [0.021]
hdf5     = false

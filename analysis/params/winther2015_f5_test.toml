# f(R) Hu-Sawicki "F5" run — Winther et al. (2015) arXiv:1506.06384
# Model: |f_R0| = 10^-5, n = 1  (mid-strength, shows clear ΔP/P bump)
# Compile with: cargo build --release --features fofr

[run]
box_size       = 250.0
n_grid         = 64
levelmax       = 0
refine_thr     = 8
a_init         = 0.02
a_final        = 1.0
dtau_max       = 5e-5
courant_factor = 0.8

[cosmology]               # Winther et al. (2015) Table 1
omega_m      = 0.269
omega_lambda = 0.731
omega_b      = 0.0455
h            = 0.704
n_s          = 0.966
sigma8       = 0.8

[gravity]
epsilon   = 1e-4
n_mg_iter = 50
n_smooth  = 2

[particles]
n_part = 64
m_part = 0.0

[scalar_field]            # Hu-Sawicki f(R) "F5" — Winther et al. (2015)
fofr0      = 1e-5         # |f_{R0}|, present-day background value
n_fofr     = 1.0          # power-law index
epsilon_mg = 1e-5

[output]
outdir   = "output_w15_f5_test"
n_output = 5
a_out    = [0.33, 0.5, 0.67, 0.82, 1.0]
hdf5     = false

# Symmetron run — Winther et al. (2015) arXiv:1506.06384 parameters
# Model: a_ssb=0.5, β=1, λ=1 Mpc/h  (also matches ISIS paper "Symm A")
# Compile with: cargo build --release --features symmetron

[run]
box_size       = 250.0
n_grid         = 64
levelmax       = 0
refine_thr     = 8
a_init         = 0.02
a_final        = 1.0
dtau_max       = 5e-5
courant_factor = 0.8

[cosmology]               # Winther et al. (2015) Table 1
omega_m      = 0.269
omega_lambda = 0.731
omega_b      = 0.0455
h            = 0.704
n_s          = 0.966
sigma8       = 0.8

[gravity]
epsilon   = 1e-4
n_mg_iter = 50
n_smooth  = 2

[particles]
n_part = 64
m_part = 0.0

[scalar_field]            # Winther et al. (2015) Symmetron parameters
a_ssb      = 0.5          # symmetry-breaking scale factor (z_ssb = 1)
lambda_0   = 1.0          # Compton wavelength [Mpc/h]
beta_0     = 1.0          # coupling strength
epsilon_mg = 1e-5
non_static = false        # quasi-static approximation (validated in paper)

[output]
outdir   = "output_w15_symmetron_test"
n_output = 5
a_out    = [0.33, 0.5, 0.67, 0.82, 1.0]
hdf5     = false

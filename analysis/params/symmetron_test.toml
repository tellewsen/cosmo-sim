# Symmetron run — small box for quick tests / development
# Parameters: "Symm A" from Llinares et al. (2014) A&A 562 A78
#   a_ssb = 0.5  (z_ssb = 1),  λ₀ = 1 Mpc/h,  β₀ = 1
# Compile with:  cargo build --release --features symmetron

[run]
box_size       = 64.0     # Mpc/h
n_grid         = 64
levelmax       = 0
refine_thr     = 8
a_init         = 0.02
a_final        = 1.0
dtau_max       = 5e-5
courant_factor = 0.8

[cosmology]               # WMAP7 / ISIS paper cosmology
omega_m      = 0.267
omega_lambda = 0.733
omega_b      = 0.0449
h            = 0.719
n_s          = 0.963
sigma8       = 0.801

[gravity]
epsilon   = 1e-4
n_mg_iter = 50
n_smooth  = 2

[particles]
n_part = 64
m_part = 0.0

[scalar_field]            # Symmetron "Symm A" — Llinares+ 2014 fiducial
a_ssb      = 0.5          # scale factor at spontaneous symmetry breaking
lambda_0   = 1.0          # Compton wavelength [Mpc/h]
beta_0     = 1.0          # coupling strength
epsilon_mg = 1e-5
non_static = false        # quasi-static approximation

[output]
outdir   = "output_symmetron_test"
n_output = 5
a_out    = [0.33, 0.5, 0.67, 0.82, 1.0]
hdf5     = false
